[package]
name = "file_vault"
version = "0.1.0"
edition = "2024"
default-run = "file_vault"

[dependencies]
sha2 = "0.10"
chrono = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "bench_results_reader"
path = "src/bench_results_reader.rs"

[[bench]]
name = "benchmark"
harness = false