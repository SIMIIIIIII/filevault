[package]
name = "file_vault"
version = "0.1.0"
edition = "2024"
default-run = "file_vault"

[workspace]
members = ["filevault-cli"]

[dependencies]
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "limit", "cors", "add-extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
jsonwebtoken = "9"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.23.1"
tokio-util = { version = "0.7.19", features = ["io"] }
axum-server = { version = "0.7.3", features = ["tls-rustls"] }
anyhow = "1"
rustls-pemfile = "2"
rustls = "0.23"
x509-parser = "0.16"
tokio-rustls = "0.26"


[[bin]]
name = "bench_results_reader"
path = "src/bench_results_reader.rs"
[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "customer"
path = "src/bin/customer.rs"

[[bin]]
name = "key"
path = "src/bin/generate_key.rs"

[[bench]]
name = "benchmark"
harness = false
