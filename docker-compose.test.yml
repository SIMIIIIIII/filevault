services:
  api:
    image: ${REGISTRY}/filevault:${IMAGE_TAG}
    build: !reset null
    ports:
      - "8443:8081"
    volumes:
      - server_files:/app/server_files
      - log_files:/app/log_files
      - ./pki:/app/pki:ro
    environment:
      DATABASE_URL: postgresql://filevault:${DB_PASSWORD}@db:5432/filevault
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: []

volumes:
  server_files:
  log_files:
