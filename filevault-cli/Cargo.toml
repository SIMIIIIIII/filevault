[package]
name = "filevault-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
futures-util = "0.3"
anyhow = "1"
dirs = "7.0.0"
tokio-util = { version = "0.7.19", features = ["io"] }