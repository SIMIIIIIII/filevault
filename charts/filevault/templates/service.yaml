apiVersion: v1
kind: Service
metadata:
  name: {{ include "filevault.fullname" . }}
  labels:
    {{- include "filevault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
  selector:
    {{- include "filevault.selectorLabels" . | nindent 4 }}
