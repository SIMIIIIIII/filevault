name: CD

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: production-deployment
    cancel-in-progress: false

jobs:
    deploy-k8s:
        name: Deploy to Kubernetes
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        environment:
            name: production
        steps:
            - name: Retrieve tested revision
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.workflow_run.head_sha }}

            - name: Check that the tested revision is still main
              id: revision
              uses: actions/github-script@v9
              with:
                script: |
                  const ref = await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: 'heads/main'
                  });
                  const current = ref.data.object.sha === context.payload.workflow_run.head_sha;
                  core.setOutput('current', String(current));
                  if (!current) core.notice('Skipping an obsolete CI run.');

            - name: Setup kubectl
              if: steps.revision.outputs.current == 'true'
              uses: azure/setup-kubectl@v3

            - name: Configure kubectl
              if: steps.revision.outputs.current == 'true'
              env:
                KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
              run: |
                test -n "$KUBE_CONFIG" || { echo "::error::Production environment secret KUBECONFIG is missing"; exit 1; }
                mkdir -p ~/.kube
                umask 077
                printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
                kubectl config current-context
                server=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
                test -n "$server" || { echo "::error::KUBECONFIG has no server for the current context"; exit 1; }
                kubectl get nodes

            - name: Setup Helm
              if: steps.revision.outputs.current == 'true'
              uses: azure/setup-helm@v3
              with:
                version: 'v3.14.0'

            - name: Helm upgrade --install
              if: steps.revision.outputs.current == 'true'
              env:
                IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/filevault
                IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
              run: |
                helm upgrade --install filevault ./charts/filevault \
                  --namespace filevault \
                  --create-namespace \
                  --values charts/filevault/values-prod.yaml \
                  --set-string "image.tag=$IMAGE_TAG" \
                  --set-string "image.repository=$IMAGE_REPOSITORY" \
                  --atomic \
                  --wait \
                  --timeout 5m \
                  --history-max 10

            - name: Verify deployment
              if: steps.revision.outputs.current == 'true'
              run: kubectl rollout status deployment/filevault-filevault -n filevault --timeout=2m
