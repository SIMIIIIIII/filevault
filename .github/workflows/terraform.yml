name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: "terraform"

jobs:
  terraform-validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false
          terraform validate

  terraform-plan-dev:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: Terraform Plan (Dev)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform plan \
            -var="environment=dev" \
            -var="image_tag=${{ github.sha }}" \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
            -out=dev.tfplan
        env:
          TF_VAR_environment: dev

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { execSync } = require('child_process');
            
            try {
              const plan = execSync('cd ${{ env.TF_WORKING_DIR }} && terraform show -no-color dev.tfplan', { encoding: 'utf8' });
              const planText = plan.length > 65536 ? plan.substring(0, 65536) + '\n... (truncated)' : plan;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Terraform Plan (Dev)\n\`\`\`\n${planText}\n\`\`\``
              });
            } catch (error) {
              console.log('Note: Could not add comment - ' + error.message);
            }

  terraform-apply-dev:
    name: Terraform Apply (Dev)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Docker (Dev)
        run: |
          # Pour dev: utiliser Docker local
          docker --version

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init

      - name: Terraform Apply (Dev)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform apply -auto-approve \
            -var="environment=dev" \
            -var="image_tag=${{ github.sha }}" \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}"

      - name: Output Dev URL
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform output api_url

  terraform-plan-prod:
    name: Terraform Plan (Prod)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' && contains(github.base_ref, 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init

      - name: Terraform Plan (Prod)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform plan \
            -var="environment=prod" \
            -var="image_tag=${{ github.ref_name }}-${{ github.sha }}" \
            -var="image_repo=${{ secrets.REGISTRY_URL }}/filevault" \
            -var="domain=${{ secrets.PROD_DOMAIN }}" \
            -var="db_password=${{ secrets.PROD_DB_PASSWORD }}" \
            -out=prod.tfplan
        env:
          KUBECONFIG: ~/.kube/config

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          TF_WORKING_DIR: ${{ env.TF_WORKING_DIR }}
        with:
          script: |
            const { execSync } = require('child_process');
            const tfWorkingDir = process.env.TF_WORKING_DIR;
            
            try {
              const plan = execSync(`cd ${tfWorkingDir} && terraform show -no-color prod.tfplan`, { encoding: 'utf8' });
              const planText = plan.length > 65536 ? plan.substring(0, 65536) + '\n... (truncated)' : plan;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Terraform Plan (Prod)\n⚠️ **REQUIRES MANUAL APPROVAL**\n\`\`\`\n${planText}\n\`\`\``
              });
            } catch (error) {
              console.log('Note: Could not add comment - ' + error.message);
            }

  terraform-apply-prod:
    name: Terraform Apply (Prod)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          test -n "${{ secrets.KUBECONFIG }}" || { echo "::error::KUBECONFIG secret is missing"; exit 1; }
          test -n "${{ secrets.PROD_DOMAIN }}" || { echo "::error::PROD_DOMAIN secret is missing"; exit 1; }
          test -n "${{ secrets.PROD_DB_PASSWORD }}" || { echo "::error::PROD_DB_PASSWORD secret is missing"; exit 1; }
          test -n "${{ secrets.REGISTRY_URL }}" || { echo "::error::REGISTRY_URL secret is missing"; exit 1; }
          echo "✅ All required secrets are configured"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init

      - name: Terraform Apply (Prod)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform apply -auto-approve \
            -var="environment=prod" \
            -var="image_tag=${{ github.ref_name }}-${{ github.sha }}" \
            -var="image_repo=${{ secrets.REGISTRY_URL }}/filevault" \
            -var="domain=${{ secrets.PROD_DOMAIN }}" \
            -var="db_password=${{ secrets.PROD_DB_PASSWORD }}"
        env:
          KUBECONFIG: ~/.kube/config

      - name: Verify Deployment
        run: |
          kubectl get pods -n filevault
          kubectl get ingress -n filevault

      - name: Slack Notification (Success)
        if: success() && secrets.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"✅ FileVault Production Deployment Successful\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*FileVault Prod Deployment*\\n*Status:* ✅ Success\\n*Branch:* main\\n*Commit:* ${{ github.sha }}\\n*URL:* https://${{ secrets.PROD_DOMAIN }}\"
                  }
                }
              ]
            }"

      - name: Slack Notification (Failure)
        if: failure() && secrets.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"❌ FileVault Production Deployment Failed\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*FileVault Prod Deployment*\\n*Status:* ❌ Failed\\n*Branch:* main\\n*Commit:* ${{ github.sha }}\"
                  }
                }
              ]
            }"
